defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z

connections:
  postgres:
    type: postgres
    host: postgres
    port: 5432
    database: synthtraffic
    user: postgres
    password: postgres
    sslmode: disable

generators:
  - name: customers
    connection: postgres
    table: customers
    config:
      maxEvents: 10
    schema:
      policy: drop-and-create
      columns:
        store: text not null
        customer_id: text primary key
        full_name: text not null
        email: text
        active: boolean default true
        created_at: timestamptz default now()
    const:
      store: ShopLane
    row:
      store: $store
      customer_id: =seq(pattern=CUST-%03d)
      full_name: =faker(person.fullName)
      email: =faker(person.email)
      active: true
      created_at: =now()