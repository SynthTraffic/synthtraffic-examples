# Customers with coherent faker person fields and stable seed/clock.
defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z
  faker:
    locale: en_US
generators:
  - name: customers
    config:
      maxEvents: 4
    const:
      source: ecommerce
      country: US
    vars:
      person: =faker(person)
    value:
      customerId: =seq(pattern=CUST-%03d)
      firstName: $person.firstName
      lastName: $person.lastName
      fullName: $person.fullName
      email: $person.email
      city: =faker(address.city)
      createdAt: =now()
