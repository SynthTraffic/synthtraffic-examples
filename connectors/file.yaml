defaults:
  seed: 42
  clock:
    start: 2026-08-31T09:30:00Z

connections:
  local-orders:
    type: file
    directory: ./output
    format: jsonl
    compression: gzip
    rolling:
      maxRecords: 3
      maxBytes: 16MiB
      maxDuration: 10s
    maxOpenStreams: 16

generators:
  - name: orders
    connection: local-orders
    config:
      maxEvents: 6
      rate: unlimited
    const:
      tenantId: tenant-123
    vars:
      outputPrefix: =formatString(orders/tenant=%s/part-, $tenantId)
    prefix: $outputPrefix
    value:
      orderId: =formatString(ORD-%06d, seq())
      tenantId: $tenantId
      amount: =float(10, 500, round=2)
      createdAt: =now()
