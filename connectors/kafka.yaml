defaults:
  seed: 42
  clock:
    start: 2026-01-02T03:04:05Z

connections:
  kafka:
    type: kafka
    brokers: [localhost:9092]
    clientId: synthtraffic-example
    acks: all

generators:
  - name: customer-events
    connection: kafka
    topic: synthtraffic-customers
    config:
      maxEvents: 2
    key: $customerId
    headers:
      eventType: CUSTOMER_CREATED
      source: synthtraffic
    value:
      customerId: =uuid()
      name: =faker(person.fullName)
      createdAt: =now()
