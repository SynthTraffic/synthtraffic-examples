connections:
  objects:
    type: s3
    bucket: =env(S3_BUCKET)
    region: =env(AWS_REGION)
    format: jsonl
    compression: gzip
    rolling:
      maxEvents: 3
      maxBytes: 16MiB
      interval: 10s
    maxOpenStreams: 16
    concurrency: 4

generators:
  - name: orders
    connection: objects
    config:
      maxEvents: 6
      rate: unlimited
    prefix: orders/part-
    value:
      orderId: =format(ORD-%06d, seq())
      createdAt: =now()
