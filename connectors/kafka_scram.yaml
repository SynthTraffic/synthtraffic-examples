# Set these environment variables for a real run; previews do not connect.
connections:
  kafka:
    type: kafka
    brokers: ['=env(KAFKA_BOOTSTRAP_SERVERS)']
    tls: true
    sasl:
      mechanism: scram-sha-256
      username: =env(KAFKA_SASL_USERNAME)
      password: =env(KAFKA_SASL_PASSWORD)
generators:
  - name: events
    connection: kafka
    topic: synthtraffic-scram
    config: {maxEvents: 2}
    value:
      id: =seq()
