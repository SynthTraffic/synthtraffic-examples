defaults:
  seed: 202
  clock:
    start: 2026-01-02T03:04:05Z

generators:
  - name: catalog_events
    config:
      maxEvents: 3
    value:
      eventId: =seq(pattern=EV-%03d)
      sku: =cycle(SKU-100, SKU-200, SKU-300)
      productName: =faker(commerce.productName)
      category: =oneOf(electronics, home, travel)
      price: =float(10, 100, round=2)
      discountEligible: =bool(0.5)
      score: =round(normal(mean=75, sd=8), 1)
      emittedAt: =now()
      emittedDay: =now(format=yyyy-MM-dd)
      emittedRFC: =now(format=RFC3339)

