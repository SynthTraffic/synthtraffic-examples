defaults:
  clock:
    start: 2026-01-02T03:04:05Z

generators:
  - name: time_demo
    config:
      maxEvents: 3
      interval: =randomDuration(100ms, 250ms)
    value:
      born: =dateBetween(1990-01-01, 2000-12-31)
      registered: =dateTimeBetween(2024-01-01T00:00:00Z, 2025-12-31T23:59:59Z)
      day: =formatDateTime(now(), format=yyyy-MM-dd, timezone=UTC)
      stamp: =formatDateTime($registered, format=RFC3339)
      wait: =randomDuration(50ms, 200ms)
      eventAt: =now()
