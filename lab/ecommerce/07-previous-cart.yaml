# ShopLane day — step 07: each cart remembers its last item count
# Why: streaming tests often need deltas from the previous event on the same entity.
# Concepts: previous(field), instance isolation, case for the first update

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z

generators:
  - name: cart_updates
    config:
      maxEvents: 8
    const:
      store: ShopLane
    instances:
      count: 2
      fields:
        cartId: =seq(pattern=CART-%02d)
        customerId: =seq(pattern=CUST-%03d)
    vars:
      updateNumber: =seq(start=1)
      itemCount: =int(1, 4)
      previousItemCount:
        =case:
          - if: =lte($updateNumber, 2)
            then: null
          - else: =previous(itemCount)
    value:
      store: $store
      cartId: $cartId
      customerId: $customerId
      updateNumber: $updateNumber
      itemCount: $itemCount
      previousItemCount: $previousItemCount
      updatedAt: =now(format=RFC3339Milli)
