# ShopLane day — step 12: flash promos interleave with order batches
# Why: campaign windows and batch schedules are part of realistic traffic shape.
# Concepts: timestamp, clockStart, addDuration, schedule mode cycle, batchSize

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z
  rate: unlimited

generators:
  - name: daily_promos
    config:
      maxEvents: 4
    const:
      store: ShopLane
    value:
      store: $store
      promoId: =seq(pattern=PROMO-%02d)
      startsAt: =timestamp(start=clockStart(), advanceBy=24h, format=RFC3339)
      endsAt: =addDuration($startsAt, 12h)

  - name: order_batches
    config:
      maxEvents: 6
    const:
      store: ShopLane
    value:
      store: $store
      batchId: =seq(start=1)
      orderId: =seq(pattern=ORD-%03d)
      at: =now(format=RFC3339Milli)

schedule:
  mode: cycle
  stages:
    - run: [daily_promos]
      batchSize: 2
    - run: [order_batches]
      batchSize: 2
