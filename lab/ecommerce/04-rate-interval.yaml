# Exercise 04 — pacing with rate and interval
# Concepts: rate, interval, maxEvents, maxDuration
# Tip: sample ignores real-time pacing; use run --stdout to feel timing.

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z

generators:
  - name: browse_events
    config:
      rate: 10/s
      maxEvents: 6
    value:
      eventId: =seq(pattern=BROWSE-%03d)
      path: =oneOf(/, /catalog, /product, /cart)
      at: =now(format=RFC3339Milli)

  - name: heartbeat
    config:
      interval: 200ms
      maxEvents: 3
      maxDuration: 2s
    value:
      beat: =seq(start=1)
      at: =now(format=RFC3339Milli)
