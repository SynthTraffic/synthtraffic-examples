# ShopLane day — step 17: park order JSONL for batch jobs
# Why: some pipelines still start from files; rolling keeps parts bounded.
# Preview with sample. Real run writes under ./output (gitignored).

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z

connections:
  local-orders:
    type: file
    directory: ./output
    format: jsonl
    compression: gzip
    rolling:
      maxRecords: 3
      maxBytes: 16MiB
      maxDuration: 10s
    maxOpenStreams: 8

generators:
  - name: orders
    connection: local-orders
    config:
      maxEvents: 6
    const:
      store: ShopLane
      tenantId: lab-tenant
    vars:
      outputPrefix: =formatString(orders/store=%s/tenant=%s/part-, $store, $tenantId)
    prefix: $outputPrefix
    value:
      store: $store
      orderId: =formatString(ORD-%06d, seq())
      tenantId: $tenantId
      amount: =float(10, 500, round=2)
      placedAt: =now(format=RFC3339Milli)
