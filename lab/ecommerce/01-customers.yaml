# ShopLane day — step 01: first signups land
# Why: prove a YAML scenario can emit events without scripts.
# Concepts: defaults.seed, maxEvents, generators, uuid(), now()

defaults:
  seed: 42
  maxEvents: 5

generators:
  - name: customers
    value:
      customerId: =uuid()
      email: "customer@example.com"
      createdAt: =now(format=RFC3339Milli)
