# ShopLane day — step 18: the whole story in one scenario
# Why: one reproducible day — catalog, shoppers, orders, pay, ship.
# Run: synthtraffic run lab/ecommerce/18-marketplace-day.yaml --stdout --seed 42

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z
  faker:
    locale: en_US

generators:
  - name: products
    config:
      maxEvents: 4
      history:
        maxEntries: 4
    const:
      store: ShopLane
    value:
      store: $store
      productId: =seq(pattern=SKU-%03d)
      name: =faker(commerce.productName)
      price: =float(12, 140, round=2)

  - name: customers
    config:
      maxEvents: 4
      history:
        maxEntries: 4
    const:
      store: ShopLane
      source: ecommerce-lab
    vars:
      person: =faker(person)
    value:
      store: $store
      source: $source
      customerId: =seq(pattern=CUST-%03d)
      fullName: $person.fullName
      email: $person.email
      city: =faker(address.city)

  - name: orders
    config:
      maxEvents: 4
      history:
        maxEntries: 4
    const:
      store: ShopLane
    value:
      store: $store
      orderId: =seq(pattern=ORD-%03d)
      customer: =ref(customers)
      product: =ref(products)
      customerId: $customer.customerId
      customerName: $customer.fullName
      productId: $product.productId
      productName: $product.name
      amount: $product.price
      placedAt: =now(format=RFC3339Milli)

  - name: payments
    config:
      maxEvents: 8
    const:
      store: ShopLane
      currency: USD
    instances:
      count: 4
      fields:
        paymentId: =seq(pattern=PAY-%03d)
        order: =ref(orders)
    value:
      store: $store
      paymentId: $paymentId
      orderId: $order.orderId
      customerId: $order.customerId
      amount: $order.amount
      currency: $currency
      eventAt: =now(format=RFC3339Milli)
    stateMachine:
      initial: authorized
      states:
        authorized:
          emit:
            status: AUTHORIZED
          next:
            =weightedOneOf:
              captured: 0.75
              failed: 0.25
        captured:
          emit:
            status: CAPTURED
        failed:
          emit:
            status: FAILED

  - name: shipments
    config:
      maxEvents: 12
    const:
      store: ShopLane
    instances:
      count: 4
      fields:
        shipmentId: =seq(pattern=SHP-%03d)
        order: =ref(orders)
    value:
      store: $store
      shipmentId: $shipmentId
      orderId: $order.orderId
      customerId: $order.customerId
      eventAt: =now(format=RFC3339Milli)
    stateMachine:
      initial: packed
      states:
        packed:
          emit:
            status: PACKED
          next: out_for_delivery
        out_for_delivery:
          emit:
            status: OUT_FOR_DELIVERY
          next: delivered
        delivered:
          emit:
            status: DELIVERED

schedule:
  stages:
    - run: [products, customers]
    - run: [orders]
    - run: [payments, shipments]
