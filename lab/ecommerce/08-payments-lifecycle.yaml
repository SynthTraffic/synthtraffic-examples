# ShopLane day — step 08: placed orders attempt capture
# Why: payment pipelines need status transitions on the same payment id.
# Concepts: schedule, ref(orders), stateMachine, weightedOneOf, terminal states

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z
  faker:
    locale: en_US

generators:
  - name: customers
    config:
      maxEvents: 2
      history:
        maxEntries: 2
    vars:
      person: =faker(person)
    value:
      customerId: =seq(pattern=CUST-%03d)
      fullName: $person.fullName

  - name: orders
    config:
      maxEvents: 4
      history:
        maxEntries: 4
    value:
      orderId: =seq(pattern=ORD-%03d)
      customer: =ref(customers)
      customerId: $customer.customerId
      amount: =float(20, 150, round=2)

  - name: payments
    config:
      maxEvents: 8
    instances:
      count: 4
      fields:
        paymentId: =seq(pattern=PAY-%03d)
        order: =ref(orders)
    const:
      store: ShopLane
      currency: USD
    value:
      store: $store
      paymentId: $paymentId
      orderId: $order.orderId
      customerId: $order.customerId
      amount: $order.amount
      currency: $currency
      eventAt: =now(format=RFC3339Milli)
    stateMachine:
      initial: authorized
      states:
        authorized:
          emit:
            status: AUTHORIZED
          next:
            =weightedOneOf:
              captured: 0.8
              failed: 0.2
        captured:
          emit:
            status: CAPTURED
        failed:
          emit:
            status: FAILED

schedule:
  stages:
    - run: [customers]
    - run: [orders]
    - run: [payments]
