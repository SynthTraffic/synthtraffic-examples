# ShopLane day — step 02: signups look like real shoppers
# Why: pipelines and demos need coherent person fields, not one hard-coded email.
# Concepts: faker locale, clock.start, const (emitted), vars, $, concat

defaults:
  seed: 42
  maxEvents: 5
  faker:
    locale: en_US
  clock:
    start: 2026-01-15T10:00:00Z

generators:
  - name: customers
    const:
      store: ShopLane
      source: ecommerce-lab
      country: US
    vars:
      person: =faker(person)
    value:
      store: $store
      source: $source
      country: $country
      customerId: =seq(pattern=CUST-%03d)
      firstName: $person.firstName
      lastName: $person.lastName
      fullName: =concat($person.firstName, " ", $person.lastName)
      email: $person.email
      phone: =faker(phone.number)
      city: =faker(address.city)
      state: =faker(address.state)
      createdAt: =now(format=RFC3339Milli)
