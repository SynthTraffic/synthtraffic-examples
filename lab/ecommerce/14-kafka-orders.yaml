# ShopLane day — step 14: the same order story, shaped for Kafka
# Why: produce realistic keys/headers/values into a topic your consumers already use.
# Preview: synthtraffic sample lab/ecommerce/14-kafka-orders.yaml --events 4 --seed 42

defaults:
  seed: 42
  clock:
    start: 2026-01-15T10:00:00Z
  faker:
    locale: en_US

connections:
  kafka:
    type: kafka
    brokers: [localhost:9092]

generators:
  - name: orders
    connection: kafka
    topic: synthtraffic-lab-orders
    config:
      maxEvents: 4
    serialization:
      key: string
      value: json
    const:
      store: ShopLane
      source: ecommerce-lab
    vars:
      orderId: =seq(pattern=ORD-%03d)
    key: =formatString(order-%s, $orderId)
    headers:
      source: $source
      store: $store
      content-type: application/json
    value:
      store: $store
      orderId: $orderId
      customerName: =faker(person.fullName)
      amount: =float(10, 200, round=2)
      placedAt: =now(format=RFC3339Milli)
