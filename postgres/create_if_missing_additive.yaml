defaults:
  seed: 42
  clock:
    start: 2026-01-02T03:04:05Z

connections:
  postgres:
    type: postgres
    url: =env(POSTGRES_URL)

generators:
  - name: additive_rows
    connection: postgres
    table: ff_additive
    config:
      maxEvents: 2
    schema:
      policy: create-if-missing
      columns:
        id: bigint primary key
        name: text not null
        status: varchar(20) default 'active'
    row:
      id: =seq()
      name: =faker(person.fullName)
      status: active
